<!doctype html><html><head><meta charset="utf-8"><title>Embed test</title>
<style>html,body{margin:0;height:100%}iframe{border:1px solid #999;width:360px;height:90vh}</style></head>
<body>
<p id="s">embed test</p><pre id="state" style="font:11px monospace;white-space:pre-wrap;max-width:1000px"></pre>
<iframe id="f" allow="clipboard-write"></iframe>
<script>
var base='https://script.google.com/a/macros/sandbox.ma/s/AKfycbzDARCnnx3GpReU-G-qNuttceo16OKlVhiwcwqqB6fwWTK-C-mPTcXdn3b7fXaMaQTD/exec';
var p=new URLSearchParams(location.search);
var u=base+'?ss='+(p.get('ss')||'')+'&authuser='+encodeURIComponent(p.get('authuser')||'')+'&embed=1';
var f=document.getElementById('f');if(p.get('h'))f.style.height=p.get('h')+'px';if(p.get('w'))f.style.width=p.get('w')+'px';f.src=u;
document.getElementById('f').onload=function(){document.getElementById('s').textContent='iframe onload fired '+new Date().toISOString();};
window.addEventListener('message',function(e){if(e.data&&e.data.sm==='state'){window.__smState=e.data;var el=document.getElementById('state');if(el)el.textContent=JSON.stringify(e.data);}});
</script>
</body></html>
